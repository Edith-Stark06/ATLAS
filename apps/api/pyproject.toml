[project]
name = "atlas-api"
version = "0.1.0"
description = "ATLAS - Adaptive Trust & Lifecycle Assurance System (API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# `Depends`/`Query` in argument defaults is the FastAPI idiom, not the B008 bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
# Import order is load-bearing: the event-loop shim must run before SQLAlchemy
# or Alembic import anything that touches a driver.
"alembic/env.py" = ["I001", "E402", "F403"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
